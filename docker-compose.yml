services:

  # ── 1. MySQL Database ──
  mysql:
    image: mysql:8.0
    container_name: shringar-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Sourav@1323}
      MYSQL_DATABASE: ${DB_NAME:-shringar_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shringar-network

  # ── 2. Spring Boot Backend API ──
  backend:
    build:
      context: ./shringar-backend
      dockerfile: Dockerfile
    container_name: shringar-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-shringar_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Sourav@1323}
      JWT_SECRET: ${JWT_SECRET:-ShringarMehendiArtSecretKey2024VeryLongSecureKeyForJWTSigningAlgorithm}
      FILE_UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: "*"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-shringar.admin@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-ruqnonatmgjxpcni}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-shringar.admin@gmail.com}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://129.225.6.28}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/settings || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - shringar-network

  # ── 3. React Customer Application ──
  frontend:
    build:
      context: ./shringar-react
      dockerfile: Dockerfile
    container_name: shringar-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - shringar-network

  # ── 4. Standalone Admin Portal ──
  admin:
    build:
      context: ./shringar-admin
      dockerfile: Dockerfile
    container_name: shringar-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5501:80"
    networks:
      - shringar-network

  # ── 5. Unified Gateway / Nginx Reverse Proxy ──
  gateway:
    image: nginx:1.27-alpine
    container_name: shringar-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - admin
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
    ports:
      - "80:80"
    networks:
      - shringar-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  shringar-network:
    driver: bridge
