user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zone (10 requests per second per IP with burst)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    # Upstream services
    upstream backend_api {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend_client {
        server frontend:80;
    }

    upstream admin_portal {
        server admin:80;
    }

    server {
        listen 80;
        server_name localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. API Reverse Proxy -> Spring Boot Backend
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 2. Uploaded Media / Images (Payment screenshots, artist portfolios, catalog photos)
        location /uploads/ {
            root /var/www;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # 3. Dedicated Admin Portal
        location = /admin-portal {
            return 301 /admin-portal/;
        }

        location /admin-portal/ {
            proxy_pass http://admin_portal/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
        }

        # 3.1 Legacy / Stale Admin Redirects & Cache Invalidation
        location ~ ^/(dashboard\.html|login\.html|designs\.html|artists\.html|orders\.html|concerns\.html|feedback\.html|coupons\.html|locations\.html|testimonials\.html|settings\.html)$ {
            add_header Clear-Site-Data "\"cache\"" always;
            return 301 /admin-portal/$1;
        }

        location ~ ^/(css/admin\.css|js/admin-api\.js) {
            add_header Clear-Site-Data "\"cache\"" always;
            return 301 /admin-portal/$1;
        }

        # 4. React Single Page Application (Default Root)
        location / {
            proxy_pass http://frontend_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
        }
    }
}
