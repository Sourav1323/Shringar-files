# ─── Server ───
server.port=8080
server.servlet.context-path=/api

# ─── Database ───
spring.datasource.url=jdbc:mysql://localhost:3306/shringar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Sourav@1323
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ─── Data Seeding ───
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ─── JWT ───
jwt.secret=ShringarMehendiArtSecretKey2024VeryLongSecureKeyForJWTSigningAlgorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ─── Razorpay ───
razorpay.key.id=rzp_test_YOUR_KEY_ID
razorpay.key.secret=YOUR_KEY_SECRET

# ─── Email (Gmail SMTP) ───
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=noreply@shringar.in

# ─── SMS (Twilio) ───
# Set twilio.enabled=true once you have real credentials from https://console.twilio.com
# India numbers note: sending transactional SMS to Indian numbers via Twilio requires
# completing DLT (Distributed Ledger Technology) registration with an Indian telecom
# operator — see https://www.twilio.com/docs/sms/send-messages-india. Until that's done,
# leave twilio.enabled=false; the booking flow logs what WOULD have been sent instead of
# failing the booking.
twilio.enabled=false
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.from-number=+15551234567

# ─── Booking Notifications ───
# Comma-separated list of email addresses that receive a copy of every new confirmed booking.
admin.notification-emails=admin@shringar.in
# Used to build links inside notification emails (e.g. "View Booking" → this + /order.html?ref=...)
app.frontend-base-url=http://localhost:5500

# ─── File Upload ───
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ─── CORS ───
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501

# ─── Logging ───
logging.level.com.shringar=DEBUG
logging.level.org.springframework.security=INFO
